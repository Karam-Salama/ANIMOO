name: animooo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

#==================================  Dev  Dependencies  Section  ==============================
dependencies:
  flutter:
    sdk: flutter

  # Icons for iOS style design
  cupertino_icons: ^1.0.8
  # Responsive UI scaling and adaptation
  flutter_screenutil: ^5.9.3
  # Native splash screen customization
  flutter_native_splash: ^2.4.4

#==================================  Dev  Dependencies  Section  ==============================
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

#==================================  Flutter  Section Add Images and Fonts ==============================
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/svgs/

  # To add assets to your application, add an assets section, like this:
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700

    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: OriginalSurfer
      fonts:
        - asset: assets/fonts/OriginalSurfer-Regular.ttf
          weight: 400

#==================================  Generate  Flutter  Assets  Section  ==============================
flutter_assets:
  assets_path: assets/svgs/
  output_path: lib/core/utils/
  filename: app_assets.dart
